name: argueless
description: "Practise curiosity and cooperation, a few minutes a day."
publish_to: 'none'

version: 0.2.0+2

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.6
  # Daily practice reminders, all on the phone. Pinned exactly (the same
  # versions as Rememberem): checked for no network use.
  flutter_local_notifications: 22.3.3
  timezone: 0.11.2
  flutter_timezone: 5.1.1
  argueless_core:
    path: ../packages/argueless_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # The practice content: subjects, rubrics and scenarios. See
    # docs/content/README.md for the format and how it is generated.
    - assets/content/
    # Every version's notes, shown on the about page.
    - assets/changelog.json
